<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="password-generator-app/starter-code/assets/images/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="password.css">
<script src="password.js" defer></script>
</head>
<body>
   <main class="main-wrapper">
   <h1 class="app-name">
    Password Generator
   </h1>
   <article class="pw-generator">

     <section class="result-copy flex-between card">
        <input type="text" class="password" aria-label="random password" placeholder="P4$5WOrd!" readonly>
        <div  class="copy-corner flex-between">
            <p class="generic"></p>
             <div data-copy="copy text">
            <svg  data-copy="copy text" width="21" height="24" xmlns="http://www.w3.org/2000/svg"><path  data-copy="copy text" d="M20.341 3.091 17.909.659A2.25 2.25 0 0 0 16.319 0H8.25A2.25 2.25 0 0 0 6 2.25V4.5H2.25A2.25 2.25 0 0 0 0 6.75v15A2.25 2.25 0 0 0 2.25 24h10.5A2.25 2.25 0 0 0 15 21.75V19.5h3.75A2.25 2.25 0 0 0 21 17.25V4.682a2.25 2.25 0 0 0-.659-1.591ZM12.469 21.75H2.53a.281.281 0 0 1-.281-.281V7.03a.281.281 0 0 1 .281-.281H6v10.5a2.25 2.25 0 0 0 2.25 2.25h4.5v1.969a.282.282 0 0 1-.281.281Zm6-4.5H8.53a.281.281 0 0 1-.281-.281V2.53a.281.281 0 0 1 .281-.281H13.5v4.125c0 .621.504 1.125 1.125 1.125h4.125v9.469a.282.282 0 0 1-.281.281Zm.281-12h-3v-3h.451c.075 0 .147.03.2.082L18.667 4.6a.283.283 0 0 1 .082.199v.451Z"/></svg>
            </div>
        </div>

     </section>

     <section class=" card">
        <form action="submit" class="length-parameters">
    <div class="length-track">
        <label for="track" class="flex-between">Charechter Length <span class="digits" aria-label="number of digits" >
              0
            </span>
        </label>
        <input type="range" max="25" min="8" class="track" aria-label="track for password length" step="0.1">
    </div>

    <div class="parameters">
        <div class="parameter">
        <input type="checkbox" class="check-box"  id="uppercase" aria-label="check to include Uppercase letters">
        <label for="uppercase" class="check-boxes">Include Uppercase Letters</label>
    </div>

    <div class="parameter">
        <input type="checkbox" class="check-box" checked id="lowercase" aria-label="check to include lowercase letters">
        <label for="lowercase" class="check-boxes">Include Lowercase Letters</label>
    </div>

        <div class="parameter">
        <input type="checkbox" class="check-box" id="numbers" aria-label="check to include numbers">
        <label for="numbers" class="check-boxes"> Include Numbers</label>
    </div>

    <div class="parameter">
        <input type="checkbox" class="check-box" id="symbols" aria-label="check to include symbols">
        <label for="symbols" class="check-boxes">Include Symbols</label>
    </div>
     <p class="error"></p>
        </div>

        <div class="strength-section card-black flex-between">
    <p>STRENGTH</p>
    <div class="strength-meter flex-between">
        <p class="level"></p>
         <div class="bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
         </div>
    </div>
</div>

    <button class="generate-btn" data-generate="random password">GENERATE <span>
       <svg  data-generate="random password" width="12" height="12" xmlns="http://www.w3.org/2000/svg"><path d="m5.106 12 6-6-6-6-1.265 1.265 3.841 3.84H.001v1.79h7.681l-3.841 3.84z"/></svg> </span>
 </button>

        </form>

     </section>

   </article>

   </main> 
</body>
</html>
